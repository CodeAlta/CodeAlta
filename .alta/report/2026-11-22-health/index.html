<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f8f7f4, #101214);
  --surface: light-dark(#ffffff, #181b1e);
  --sunken: light-dark(#f1efea, #0b0d0e);
  --ink: light-dark(#1d1c1a, #e9e7e2);
  --muted: light-dark(#6a675f, #9b988f);
  --line: light-dark(#e3e0d8, #2a2e33);
  --accent: light-dark(#255f85, #7db8dc);
  --good: light-dark(#1f7a55, #5fcf9d);
  --good-bg: light-dark(#e3f3ea, #12301f);
  --warn: light-dark(#9a6200, #e8b455);
  --warn-bg: light-dark(#fbefd5, #33270c);
  --bad: light-dark(#b3352b, #f08a7e);
  --bad-bg: light-dark(#fbe6e2, #3a1512);
  --info-bg: light-dark(#e4eff6, #12283a);
  --mute-bg: light-dark(#eceae4, #22262a);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4rem; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: .87em; }
code { background: var(--mute-bg); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0; }
h1 { font-size: 2.3rem; letter-spacing: -.01em; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .7em; }
p:last-child, ul:last-child { margin-bottom: 0; }
ul { margin: 0 0 .7em; padding-left: 1.15em; }
li { margin: .15em 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.5rem; }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 1.1rem; height: 3rem; }
.bar nav { display: flex; gap: 1rem; flex: 1; overflow-x: auto; white-space: nowrap; font-size: .88rem; }
.bar nav a { color: var(--muted); }
.bar nav a:hover { color: var(--ink); text-decoration: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: .2rem .7rem; font-size: .8rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .2rem .75rem; font-size: .8rem; color: var(--muted); }
.ghost:hover { color: var(--ink); }

/* header */
header.top { padding: 3.2rem 0 1.4rem; }
header.top h1 { margin: .5rem 0 1rem; }
.verdict { font-family: var(--serif); font-size: 1.28rem; line-height: 1.45; max-width: 46rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; margin: 2rem 0 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .85rem 1rem; }
.tile b { display: block; font: 600 1.7rem/1.1 var(--serif); }
.tile span { display: block; font-size: .82rem; }
.tile small { display: block; color: var(--muted); font-size: .76rem; margin-top: .2rem; }
.tile.good b { color: var(--good); } .tile.warn b { color: var(--warn); } .tile.bad b { color: var(--bad); }

section { padding: 2.4rem 0; border-top: 1px solid var(--line); }
section > .wrap > h2 { margin-bottom: .35rem; }
.lead { color: var(--muted); max-width: 46rem; margin-bottom: 1.3rem; }

/* start here */
.moves { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .8rem; counter-reset: move; }
.move { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; color: inherit; counter-increment: move; }
.move:hover { border-color: var(--accent); text-decoration: none; }
.move::before { content: counter(move); font: 600 1.6rem/1 var(--serif); color: var(--accent); display: block; margin-bottom: .45rem; }
.move b { display: block; margin-bottom: .25rem; }
.move span { font-size: .88rem; color: var(--muted); }

/* badges */
.badge { display: inline-block; font-size: .72rem; line-height: 1; padding: .28em .6em; border-radius: 999px; background: var(--mute-bg); color: var(--muted); white-space: nowrap; }
.badge.strong { background: var(--good-bg); color: var(--good); }
.badge.worth-exploring { background: var(--warn-bg); color: var(--warn); }
.badge.speculative { background: var(--mute-bg); color: var(--muted); }
.badge.act { background: none; border: 1px solid var(--line); color: var(--ink); }
.badge.act.delete, .badge.act.merge, .badge.act.simplify { border-color: var(--good); color: var(--good); }
.badge.act.add { border-color: var(--warn); color: var(--warn); }
.badge.risk-high { background: var(--bad-bg); color: var(--bad); }

/* maps */
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 1.2rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; min-width: 0; }
.panel h3 { margin-bottom: .2rem; }
.panel > p { font-size: .84rem; color: var(--muted); margin-bottom: .8rem; }
table.grid { border-collapse: separate; border-spacing: 4px; width: 100%; table-layout: fixed; font-size: .8rem; }
table.grid th { font-weight: 500; color: var(--muted); text-align: left; padding: .2rem .3rem; overflow-wrap: anywhere; }
table.grid thead th { text-align: center; font-size: .74rem; }
table.grid th:first-child { width: 27%; }
table.heat th:first-child { width: 36%; }
table.grid td { background: var(--sunken); border-radius: 6px; padding: .35rem; vertical-align: top; height: 3rem; }
table.grid td.best { outline: 2px dashed var(--good); outline-offset: -2px; }
table.heat td { text-align: center; vertical-align: middle; height: 2.1rem; cursor: pointer; font-weight: 600; }
table.heat td { padding: 0; }
table.heat button.cell { all: unset; display: block; width: 100%; line-height: 2.1rem; text-align: center; font-weight: 600; cursor: pointer; border-radius: 6px; }
table.heat button.cell:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.chip { display: inline-block; margin: 2px; padding: .12em .5em; border-radius: 5px; font: 600 .74rem/1.5 var(--mono); background: var(--mute-bg); color: var(--ink); }
.chip.strong { background: var(--good-bg); color: var(--good); }
.chip.worth-exploring { background: var(--warn-bg); color: var(--warn); }
.chip:hover { text-decoration: none; outline: 1px solid currentColor; }
.panel.wide { grid-column: 1 / -1; }
table.who th:first-child { width: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
table.who th a { color: var(--ink); }
table.who thead th:not(:first-child) { width: 7.5rem; }
table.who td { height: auto; text-align: center; vertical-align: middle; font-size: .76rem; font-weight: 600; padding: .3rem; }
td.vote-cell.found, td.vote-cell.confirmed { background: var(--good-bg); color: var(--good); }
td.vote-cell.refined { background: var(--warn-bg); color: var(--warn); }
td.vote-cell.disputed { background: var(--bad-bg); color: var(--bad); }
.scatter { width: 100%; height: auto; max-width: 780px; display: block; margin-bottom: 1rem; }
.scatter text { font: 10px var(--sans); fill: var(--muted); }
.scatter .axis { stroke: var(--line); }
.scatter circle { fill: var(--muted); fill-opacity: .45; stroke: var(--surface); }
.scatter a circle { fill: var(--accent); fill-opacity: .85; }
.scatter .name { fill: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; margin: 0 0 1.4rem; }
.filters .group { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin-right: .7rem; }
.filters .group > span { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-right: .15rem; }
.filters button.f { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .15rem .65rem; font-size: .8rem; color: var(--muted); }
.filters button.f[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.filters input { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: .22rem .8rem; font: inherit; font-size: .82rem; min-width: 11rem; }
.count { font-size: .8rem; color: var(--muted); margin-left: auto; }

/* themes and findings */
.theme { margin: 0 0 2rem; }
.theme > h3 { font-size: 1.25rem; }
.theme > p { color: var(--muted); max-width: 46rem; margin: .25rem 0 .8rem; }
details.finding { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: .5rem 0; }
details.finding[open] { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
details.finding > summary { list-style: none; cursor: pointer; padding: .8rem 1.1rem; display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .9rem; align-items: baseline; }
details.finding > summary::-webkit-details-marker { display: none; }
.fid { font: 600 .8rem var(--mono); color: var(--muted); }
.ftitle { font-weight: 600; }
.fclaim { grid-column: 2 / 3; color: var(--muted); font-size: .9rem; }
.fmeta { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.votes { display: inline-flex; gap: 3px; margin-left: .25rem; }
.vote { width: 1.25rem; height: 1.25rem; border-radius: 50%; font: 700 .68rem/1.25rem var(--sans); text-align: center; background: var(--mute-bg); color: var(--muted); }
.vote.found, .vote.confirmed { background: var(--good-bg); color: var(--good); }
.vote.refined { background: var(--warn-bg); color: var(--warn); }
.vote.disputed { background: var(--bad-bg); color: var(--bad); }
.fbody { padding: .3rem 1.1rem 1.2rem; border-top: 1px solid var(--line); }
.fbody h4 { font: 600 .74rem var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 1.2rem 0 .4rem; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 2rem; }
.evidence { list-style: none; padding: 0; }
.evidence li { padding: .35rem 0 .35rem .8rem; border-left: 2px solid var(--line); margin: .3rem 0; font-size: .92rem; }
.evidence .where { display: block; font: .8rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.balance { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .6rem; }
.balance > div { border-radius: 8px; padding: .6rem .8rem; font-size: .92rem; }
.balance .minus { background: var(--good-bg); }
.balance .plus { background: var(--warn-bg); }
.balance b { display: block; font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; margin-bottom: .25rem; }
.balance .minus b { color: var(--good); } .balance .plus b { color: var(--warn); }
.delta { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
.delta span { font: 600 .78rem var(--mono); padding: .15em .55em; border-radius: 5px; background: var(--mute-bg); }
.delta span.neg { background: var(--good-bg); color: var(--good); }
.delta span.pos { background: var(--warn-bg); color: var(--warn); }
.callout { border-radius: 8px; padding: .6rem .8rem; font-size: .92rem; background: var(--info-bg); margin-top: .9rem; }
.callout.dissent { background: var(--warn-bg); }
.callout b { font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; display: block; margin-bottom: .15rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1.1rem; align-items: center; font-size: .82rem; color: var(--muted); }

/* before / after */
.ba { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: .8rem; }
.ba > div { background: var(--sunken); border-radius: 8px; padding: .8rem; min-width: 0; }
.ba .tag { font: 600 .7rem var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .6rem; }
.ba .after .tag { color: var(--good); }
.dg + .dg { margin-top: .7rem; }
.dg-note { font-size: .8rem; color: var(--muted); margin-top: .4rem; }
.box { border: 1.5px solid var(--line); background: var(--surface); border-radius: 7px; padding: .4rem .6rem; font-size: .82rem; min-width: 0; }
.box > b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.box > small { color: var(--muted); display: block; }
.box.deep { border-width: 3px; border-color: var(--ink); }
.box.good { border-color: var(--good); background: var(--good-bg); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); }
.box.bad { border-color: var(--bad); background: var(--bad-bg); }
.box.gone { border-style: dashed; opacity: .55; text-decoration: line-through; }
.box.faded { opacity: .55; }
.boxes { display: flex; flex-wrap: wrap; gap: .45rem; }
.boxes > .box { flex: 1 1 110px; }
.box .boxes { margin-top: .4rem; }
.layers { display: flex; flex-direction: column; gap: 3px; }
.layers .box { border-radius: 4px; border-left-width: 5px; }
.layers .arrow, .flow .arrow { color: var(--muted); text-align: center; font-size: .8rem; line-height: 1; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; }
.flow .box { flex: 0 1 auto; }
.bars { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto; gap: .3rem .6rem; align-items: center; font-size: .82rem; }
.bars .track { background: var(--mute-bg); border-radius: 4px; height: .8rem; overflow: hidden; }
.bars .fill { height: 100%; background: var(--muted); border-radius: 4px; }
.bars .fill.good { background: var(--good); } .bars .fill.warn { background: var(--warn); } .bars .fill.bad { background: var(--bad); }
.bars .num { font-family: var(--mono); font-size: .78rem; text-align: right; }
.mass { display: flex; gap: .8rem; align-items: flex-end; flex-wrap: wrap; }
.mass figure { margin: 0; text-align: center; font-size: .78rem; flex: 1 1 80px; }
.mass .if { background: var(--warn); border-radius: 4px 4px 0 0; }
.mass .im { background: var(--ink); opacity: .8; border-radius: 0 0 4px 4px; margin-top: 2px; }
.mass figcaption { margin-top: .3rem; color: var(--muted); overflow-wrap: anywhere; }
.text { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .75rem; font-size: .88rem; white-space: pre-wrap; }
.text + .dg-note { font-family: var(--mono); }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .75rem; font: .78rem/1.5 var(--mono); overflow-x: auto; }
.edges { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .3rem .5rem; align-items: center; }
.edges .arrow { color: var(--muted); font-size: .78rem; white-space: nowrap; }

/* roadmap */
.waves { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
.wave { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
.wave > p { font-size: .84rem; color: var(--muted); margin: .2rem 0 .6rem; }
.wave ol { margin: 0; padding-left: 1.2rem; }
.wave li { margin: .45rem 0; font-size: .92rem; }
.wave li small { display: block; color: var(--muted); }

/* appendix */
details.more { border-top: 1px solid var(--line); padding: .7rem 0; }
details.more > summary { cursor: pointer; font-weight: 600; }
details.more > div { padding: .8rem 0 .3rem; }
table.plain { border-collapse: collapse; width: 100%; font-size: .86rem; }
table.plain th, table.plain td { text-align: left; padding: .35rem .6rem .35rem 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
table.plain th { font-weight: 500; color: var(--muted); font-size: .78rem; }
table.plain td.n { font-family: var(--mono); text-align: right; white-space: nowrap; }
footer { padding: 2rem 0 3rem; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); }
.hidden { display: none !important; }
@media (max-width: 640px) {
  h1 { font-size: 1.8rem; }
  details.finding > summary { grid-template-columns: auto 1fr; }
  .fmeta { grid-column: 1 / -1; justify-content: flex-start; }
}
@media print {
  .bar, .filters, .actions button { display: none !important; }
  :root, :root[data-theme] { color-scheme: light !important; }
  details.finding { break-inside: avoid; }
}
</style>
</head>

ra","model":"codex:gpt-6.2-astra@max","role":"analyst","analysis":"analysis/gpt-6.2-astra.md","review":"analysis/gpt-6.2-astra.review.md"}],"themes":[{"id":"saves","title":"Saves that lose what they keep","thesis":"A save that succeeds and loses state costs more than one that fails: these come first.","findings":["F01","F02","F03","F04"]},{"id":"twice","title":"One decision kept in two places","thesis":"Each was fixed in one place and missed in the other; the cure makes it exist once.","findings":["F05","F06","F07","F08"]},{"id":"dead","title":"Code that only its tests reach","findings":["F09","F10"]},{"id":"window","title":"The state of the desktop window in one component","findings":["F11"]},{"id":"tests","title":"Tests and CI that say what failed","thesis":"Every other change of this review is judged by the suite.","findings":["F12","F13","F14"]},{"id":"text","title":"Text agents load in every session","findings":["F15","F16"]}],"findings":[{"id":"F01","title":"Keep the automation state within the size its own reader accepts","lens":"persistence","area":"automations","action":"fix","strength":"strong","impact":"high","effort":"S","risk":"low","claim":"The automation state can be saved larger than the 8 MiB its reader accepts; the next start then loads empty state with every automation paused, no run history and no trigger watermarks.","candidates":["C01"],"evidence":[{"text":"A try records each call it does not make, as a line of up to 2,000 characters.","file":"src/CodeAlta.Automations/AutomationService.Autonomy.cs","line":"132"},{"text":"Up to 50 such calls per run.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"51"},{"text":"100 runs kept per automation, 2,000 in all, against a reader limit of 8 MiB: one automation alone can reach 10 MB.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"190-195"},{"text":"Retention counts runs, not bytes.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"313"},{"text":"The reader returns nothing above the limit and marks the file unreadable; the store then starts empty and paused.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"444"},{"text":"The paused, empty state that replaces it.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"219"},{"text":"\u0060Save\u0060 writes the whole state whatever its size.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"467"}],"change":"Make the read limit a rule of the save: when the serialized state is over budget, drop the oldest completed runs, their calls first, until it fits. Never drop runs in progress, the pause choice, approvals or trigger watermarks; if those alone do not fit, fail the save and keep the last readable file.","balance":{"removes":["the outcome where a save succeeds and the next start loses the state of every automation"],"adds":["a size check on the bytes already serialized","one round-trip test"]},"before":{"type":"flow","items":[{"label":"tries record their calls"},{"label":"save: 9 MB","tone":"warn","note":"written without a check"},{"label":"next start: over 8 MiB","tone":"bad","note":"read as unreadable"},{"label":"all automations paused, history gone","tone":"bad"}]},"after":{"type":"flow","items":[{"label":"tries record their calls"},{"label":"save: over budget","note":"oldest completed runs dropped first"},{"label":"file under 8 MiB","tone":"good"},{"label":"next start keeps state and pause choice","tone":"good"}]},"firstStep":"A test that fills a state just under 8 MiB, adds one run that crosses the limit and reopens the store: today it starts paused and empty. Then the size check in \u0060Save\u0060.","verify":["The reopened store keeps the newest run and a watermark set before, and stays unpaused.","The automation tests of \u0060CodeAlta.Desktop.Tests\u0060 pass; the test of a malformed file still pauses."],"risks":["The limits on runs become upper bounds: 100 very large runs may not all be kept."],"ifNot":"A user who runs long tries of many automations finds them all paused one morning, with their history and trigger state gone.","votes":{"opus":"confirmed","gemini":"confirmed","astra":"found"},"files":["src/CodeAlta.Automations/AutomationState.cs","src/CodeAlta.Automations/AutomationService.Autonomy.cs"]},{"id":"F02","title":"Grant an automation occurrence only once its claim is written","lens":"persistence","area":"automations","action":"fix","strength":"strong","impact":"medium","effort":"S","risk":"low","claim":"When the claim file cannot be written, \u0060TryClaim\u0060 still grants the occurrence; after a restart the claim is gone and the same occurrence can be granted and run a second time.","candidates":["C05"],"evidence":[{"text":"\u0060TryClaim\u0060 saves, then returns true whatever the save did.","file":"src/CodeAlta.Automations/AutomationClaims.cs","line":"153"},{"text":"\u0060Save\u0060 swallows I/O and access errors.","file":"src/CodeAlta.Automations/AutomationClaims.cs","line":"253"},{"text":"An unreadable claim file reads as no claims at all.","file":"src/CodeAlta.Automations/AutomationClaims.cs","line":"239"},{"text":"The grant reaches the start of the run.","file":"src/CodeAlta.Automations/AutomationService.cs","line":"797"},{"text":"Commit \u006009ee9a3ef\u0060 fixed the same assumption for the hourly call counter, whose store now returns the result of its save.","file":"src/CodeAlta.Automations/AutomationState.cs","line":"420"}],"change":"\u0060Save\u0060 returns whether it wrote, and \u0060TryClaim\u0060 grants only then. An unreadable ledger means \u0022storage unavailable\u0022, not \u0022no claims\u0022: the scheduler skips or defers the occurrence with that reason.","balance":{"removes":["a grant that no file records","the reading of an I/O error as an absence"],"adds":["a claim outcome","an error-path test"]},"firstStep":"In the placement fixture, make the claim file unwritable and check that the start is refused; keep the restart test that passes today.","verify":["Zero runner starts on a failed claim write.","After the storage recovers, a reopened store refuses the same occurrence."],"risks":["A missed or deferred occurrence is preferred to a duplicate run: a pooled event must not be marked seen when its claim failed."],"ifNot":"Rare, but when it happens the side effects of an automation run twice.","votes":{"opus":"confirmed","gemini":"confirmed","astra":"found"},"files":["src/CodeAlta.Automations/AutomationClaims.cs","src/CodeAlta.Automations/AutomationService.cs"]},{"id":"F03","title":"Edit the providers of \u0060config.toml\u0060 through the store\u0027s locked update, on the raw definitions","lens":"persistence","area":"provider settings","action":"merge","strength":"strong","impact":"high","effort":"M","risk":"medium","claim":"Fourteen call sites in the desktop, the node and the TUI read and rewrite the whole provider list of \u0060config.toml\u0060 by themselves: none holds the file lock from the read to the write, and two read the definitions with their defaults filled in, so adding a model server writes defaults into every other provider.","candidates":["C10","C13"],"evidence":[{"text":"The store already has a read-and-save under the lock of the file, which nine settings writers use and no provider edit does.","file":"src/CodeAlta.Catalog/CodeAltaConfigStore.cs","line":"275"},{"text":"The callers of \u0060UpdateGlobal\u0060: settings only.","command":"git grep -n \u0027.UpdateGlobal(\u0027 -- \u0027src/*.cs\u0027 \u0027:!src/*Tests*\u0027"},{"text":"The 14 callers of the whole-list save, outside the store.","command":"git grep -n \u0027SaveGlobalProviderDefinitions(\u0027 -- \u0027src/*.cs\u0027 \u0027:!src/*Tests*\u0027"},{"text":"The text editor holds the file lock across its revision check and its save.","file":"src/CodeAlta/Desktop/Rpc/GlobalConfigRpc.cs","line":"124"},{"text":"The structured form checks the revision under an in-process lock only; the store takes the file lock at the save.","file":"src/CodeAlta/Desktop/Rpc/GlobalConfigRpc.cs","line":"943"},{"text":"Adding a model server reads the completed definitions and saves them all back.","file":"src/CodeAlta/Desktop/DesktopApplication.cs","line":"909-917"},{"text":"That read fills in the defaults of every definition.","file":"src/CodeAlta.Catalog/CodeAltaConfigStore.cs","line":"1879"},{"text":"The node does the same for the providers of a scope.","file":"src/CodeAlta.Node/NodeScopeProviders.cs","line":"143"},{"text":"The form avoids it on purpose: \u0022no defaults are filled in, so saving them back adds none\u0022.","file":"src/CodeAlta/Desktop/Rpc/GlobalConfigRpc.cs","line":"976"}],"change":"Give the store one provider edit: under \u0060ConfigFileLock\u0060, read the raw definitions, apply the caller\u0027s change, check the revision when the caller has one, save. Move the 14 call sites to it, the model-server and node paths first. Complete the definitions only to apply them to the runtime, after the write.","balance":{"removes":["14 hand-written read-modify-write loops","defaults written into untouched providers","edits lost between two writers (the developer instance shares \u0060config.toml\u0060)"],"adds":["one store method of about 20 lines","a two-writer test and a raw round-trip test"]},"before":{"type":"layers","items":[{"label":"14 callers","note":"desktop, node, TUI"},{"label":"read: completed or raw, each its own","tone":"warn"},{"label":"edit, unlocked","tone":"bad"},{"label":"SaveGlobalProviderDefinitions","note":"takes the lock only here"}]},"after":{"type":"layers","items":[{"label":"14 callers"},{"label":"the store\u0027s provider edit","tone":"deep","note":"lock, raw read, edit, revision, save"},{"label":"runtime gets completed definitions","note":"after the write"}]},"firstStep":"Add the store method and move the model-server path to it, with a test: a config with a minimal Codex provider keeps no \u0060api_url\u0060, \u0060max_concurrent_requests\u0060 or \u0060model_discovery\u0060 after a model server is ":"src/CodeAlta.Tui/Views/ModelProvidersDialog.cs","line":"1459"},{"text":"The merge removes the modeled keys a definition no longer has.","file":"src/CodeAlta.Catalog/CodeAltaConfigStore.cs","line":"2222"},{"text":"Commit \u006077da0870b\u0060 had to add the model visibility rules to both copies; a third copier exists for documents.","file":"src/CodeAlta.Catalog/CodeAltaConfigDocumentCopy.cs","line":"153"}],"change":"Use \u0060CodeAltaConfigStore.CloneProviderDefinition\u0060 in both paths of the TUI editor and delete its copier.","balance":{"removes":["a 64-line copier and its own list of fields"],"adds":["one preservation test"],"delta":{"lines":-60}},"firstStep":"Extend the round trip of \u0060ProviderFrontendCoordinatorTests\u0060 with an untouched provider that has a \u0060server\u0060 and a \u0060context_size\u0060: it fails today. Then replace the copier.","verify":["The untouched provider keeps both settings when the config is reopened.","The tests of omitted defaults still pass."],"risks":["The store\u0027s copy deep-copies nested tables: compare values, not references."],"ifNot":"A TUI user who renames one provider loses the model server or the sandbox of another.","votes":{"opus":"confirmed","gemini":"confirmed","astra":"found"},"files":["src/CodeAlta.Tui/ViewModels/ModelProviderEditorItemViewModel.cs"]},{"id":"F05","title":"Add the missing columns of the session list at each open, from one list","lens":"persistence","area":"session list","action":"simplify","strength":"strong","impact":"high","effort":"S","risk":"low","claim":"Three times in six days a column added to the session list broke listing sessions on every existing database (\u0022no such column\u0022), because its migration only runs when \u0060SchemaVersion\u0060 changes and the version was not raised.","candidates":["C04"],"evidence":[{"text":"The migration is skipped when the stored version is the one asked for.","file":"src/CodeAlta.Catalog/ApplicationDatabase.cs","line":"345"},{"text":"The version of the session list.","file":"src/CodeAlta.Catalog/SessionJournalSqliteCache.cs","line":"15"},{"text":"Nine hand-written \u0060Add…ColumnAsync\u0060 methods, each a \u0060pragma_table_info\u0060 check then an \u0060ALTER TABLE\u0060.","file":"src/CodeAlta.Catalog/SessionJournalSqliteCache.cs","line":"1599-1785"},{"text":"Three fixes that only raised the version: sandbox column (\u0022no such column: c.local_sandbox\u0022), options column, cloud column.","command":"git show --stat 77e0346bd c3a5461df 8f15ae2f5"},{"text":"Every new fact about sessions is a column or a table of the database.","file":"doc/development-guide.md","line":"7"}],"change":"Declare each column once: name, type, and whether adding it invalidates the rows. At each open, read \u0060pragma_table_info\u0060 (a read) and add what is missing in one write. Keep \u0060SchemaVersion\u0060 for what a list of columns cannot express: moving large values, dropping a column.","balance":{"removes":["nine near-identical methods, about 170 lines","the rule \u0022raise the version when you add a column\u0022"],"adds":["a column table and a loop of about 30 lines"],"delta":{"lines":-140}},"before":{"type":"flow","items":[{"label":"add the column to \u0060CREATE TABLE\u0060"},{"label":"write an \u0060Add…ColumnAsync\u0060"},{"label":"forget to raise the version","tone":"bad"},{"label":"existing databases: \u0022no such column\u0022","tone":"bad"}]},"after":{"type":"flow","items":[{"label":"add the column to the list"},{"label":"open: read \u0060pragma_table_info\u0060"},{"label":"missing column added","tone":"good"}]},"firstStep":"A test that creates the session tables without one declared column, at the current version, then lists sessions: it fails today. Then the loop; the nine methods go.","verify":["That test passes, also for a column added to the list without changing the version.","\u0060CodeAlta.Catalog.Tests\u0060 pass."],"risks":["The permission-mode and space columns also clear the rows: keep that flag per column.","An up-to-date database must stay a read at open (\u0060ApplicationDatabase.cs:337\u0060)."],"ifNot":"The next column of a session breaks the session list of every user who already has a database.","votes":{"opus":"found","gemini":"confirmed","astra":"disputed"},"files":["src/CodeAlta.Catalog/SessionJournalSqliteCache.cs"],"dissent":"One analyst would keep the version gate and add a test that opens a fixture of the last shipped schema at its real version, refreshed with each release. It catches a missed bump; the column list removes the bump itself and the nine methods, for one read of \u0060pragma_table_info\u0060 at open. Kept: the column list."},{"id":"F06","title":"Give Settings the inherited project scope that sessions use","lens":"duplication","area":"settings of a sub-project","action":"merge","strength":"strong","impact":"medium","effort":"M","risk":"medium","claim":"For a sub-project, Settings and the session disagree on skills, prompts and plugins: a repository skill offered to the session is missing from Settings, a skill the parent turned off shows as on, and the Prompts and Plugins pages show the sub-project\u0027s own entries only, against the user guide.","candidates":["C16"],"evidence":[{"text":"A session takes the inherited roots, the effective folders and the disabled names of every ancestor.","file":"src/CodeAlta.Catalog/Skills/SkillCatalogQuery.cs","line":"160-175"},{"text":"The Settings listing reads the sub-project\u0027s disabled names only, with one root.","file":"src/CodeAlta.Catalog/Skills/SkillManagementService.cs","line":"92"},{"text":"Its query: one project root.","file":"src/CodeAlta.Catalog/Skills/SkillManagementService.cs","line":"149"},{"text":"The page passes \u0060SkillFolders\u0060, not \u0060EffectiveSkillFolders\u0060.","file":"src/CodeAlta/Desktop/Rpc/SkillsRpc.cs","line":"517"},{"text":"The scope of a Settings page is resolved to a root only, for every page.","file":"src/CodeAlta/Desktop/Rpc/McpServersRp label":"LabelsRpc.cs","tone":"deep","note":"service and its JSON types"},{"label":"shared","children":[{"label":"DesktopApplication.cs"},{"label":"main.tsx"}]}]},"firstStep":"Move the attributes of one RPC file (\u0060ReleaseNotesRpc.cs\u0060) to a partial declaration in that file; build and run its RPC tests.","verify":["\u0060BootRpc.cs\u0060 holds the boot types only.","A new service edits its own file, \u0060DesktopApplication.cs\u0060 and \u0060main.tsx\u0060, nothing else."],"risks":["A type shared by two services is declared once.","The demo answers some reads with empty data on purpose (\u0060labels.list\u0060): those stay explicit."],"dissent":"One analyst proposed one JSON context per RPC file, combined at start: \u0060[assembly: NeoRpcJsonContext(typeof(DesktopJsonContext))]\u0060 names a single context for NeoAstra, so the partial declarations are the cure kept. Another showed that \u0060export *\u0060 in the fixtures would lose the choices they make on purpose: they stay explicit.","votes":{"opus":"found","gemini":"found","astra":"refined"},"files":["src/CodeAlta/Desktop/Rpc/BootRpc.cs","src/CodeAlta/frontend/src/demo-api.ts","src/CodeAlta/frontend/src/projectFocus.neoastra.mount.ts"]},{"id":"F08","title":"Remove the early return that drops the credential policies of the \u0060alta\u0060 commands","lens":"duplication","area":"alta live tool","action":"fix","strength":"strong","impact":"low","effort":"S","risk":"low","claim":"The built-in commands test about 20 optional services twice, once to build the commands and once to list their policies, and the two lists have drifted: a credential broker alone enables the \u0060credential\u0060 commands, but the early return of the policies does not test it and skips their policies.","candidates":["C08"],"evidence":[{"text":"A broker alone adds the \u0060credential\u0060 commands.","file":"src/CodeAlta.LiveTool/BuiltInAltaCommandContributor.cs","line":"180"},{"text":"The early return lists 20 services but not the   const state = { lens: null, area: null, strength: null, action: null, q: "" };
  if (findings.length > 2) {
    const s = section("map", "Where it pays", "Each finding by what it gains and what it costs, and where the findings concentrate.");
    const maps = h("div", { class: "maps" });
    const impacts = ["high", "medium", "low"], efforts = ["S", "M", "L"];
    const t = h("table", { class: "grid" }, h("thead", {}, h("tr", {}, h("th", {}), efforts.map((e) => h("th", { text: EFFORT[e] + " effort" })))));
    const tb = h("tbody");
    for (const im of impacts) tb.append(h("tr", {}, h("th", { text: im + " impact" }), efforts.map((e) => h("td", { class: im === "high" && e === "S" ? "best" : "" },
      findings.filter((f) => f.impact === im && f.effort === e).map((f) => h("a", { class: "chip " + (f.strength || ""), href: "#" + f.id, title: f.title, text: f.id }))))));
    t.append(tb);
    maps.append(h("div", { class: "panel" }, h("h3", { text: "Impact and effort" }), h("p", { text: "Dashed cell: high impact for a small effort. Green: strong, amber: worth exploring, gray: speculative." }), t));

    const lenses = [...new Set(findings.map((f) => f.lens).filter(Boolean))];
    const areaCount = {};
    for (const f of findings) if (f.area) areaCount[f.area] = (areaCount[f.area] || 0) + 1;
    const areas = Object.keys(areaCount).sort((a, b) => areaCount[b] - areaCount[a]).slice(0, 10);
    if (lenses.length > 1 && areas.length > 1) {
      const ht = h("table", { class: "grid heat" }, h("thead", {}, h("tr", {}, h("th", {}), lenses.map((l) => h("th", { text: l })))));
      const hb = h("tbody");
      const peak = Math.max(...areas.flatMap((a) => lenses.map((l) => findings.filter((f) => f.area === a && f.lens === l).length))) || 1;
      for (const a of areas) hb.append(h("tr", {}, h("th", { class: "mono", text: a }), lenses.map((l) => {
        const n = findings.filter((f) => f.area === a && f.lens === l).length;
        const td = h("td", { class: n ? "" : "zero", style: n ? `background: color-mix(in srgb, var(--accent) ${Math.round(18 + (62 * n) / peak)}%, var(--sunken)); color: ${n / peak > 0.5 ? "var(--bg)" : "var(--ink)"}` : "" });
        if (n) {
          const show = h("button", { type: "button", class: "cell", text: n, title: `Show the ${n} finding(s): ${l} in ${a}` });
          show.addEventListener("click", () => { state.lens = l; state.area = a; applyFilters(); document.getElementById("findings").scrollIntoView(); });
          td.append(show);
        }
        return td;
      })));
      ht.append(hb);
      maps.append(h("div", { class: "panel" }, h("h3", { text: "Where the findings are" }), h("p", { text: "Findings per area and lens. Click a cell to list them." }), ht));
    }
    s.append(maps);
  }

  /* findings by theme */
  const fs = section("findings", "Findings", findings.length ? "Grouped by theme. Open a finding for its evidence, the change, and how to start." : null);
  const filterBar = h("div", { class: "filters" });
  const countEl = h("span", { class: "count" });
  function group(label, key, values) {
    if (values.length < 2) return;
    filterBar.append(h("div", { class: "group" }, h("span", { text: label }), values.map((v) => {
      const b = h("button", { class: "f", type: "button", "data-key": key, "data-value": v, "aria-pressed": "false", text: v.replace("-", " ") });
      b.addEventListener("click", () => { state[key] = state[key] === v ? null : v; if (key === "lens") state.area = null; applyFilters(); });
      return b;
    })));
  }
  const uniq = (k) => [...new Set(findings.map((f) => f[k]).filter(Boolean))];
  group("Lens", "lens", uniq("lens"));
  group("Strength", "strength", ["strong", "worth-exploring", "speculative"].filter((v) => findings.some((f) => f.strength === v)));
  group("Action", "action", uniq("action"));
  const search = h("input", { type: "search", placeholder: "Filter by text or path", "aria-label": "Filter findings" });
  search.addEventListener("input", () => { state.q = search.value.toLowerCase(); applyFilters(); });
  const areaChip = h("button", { class: "f hidden", type: "button", "aria-pressed": "true", title: "Show every area" });
  areaChip.addEventListener("click", () => { state.area = null; state.lens = null; applyFilters(); }); // a cell of the map set both
  filterBar.append(search, areaChip, countEl);
  if (findings.length > 2) fs.append(filterBar);
  if (!findings.length) fs.append(h("p", { class: "muted", text: "The review kept no finding." }));
  const placed = new Set();
  const themes = (R.themes || []).slice();
  for (const th of themes) (th.findings || []).forEach((id) => placed.add(id));
  const rest = findings.filter((f) => !placed.has(f.id)).map((f) => f.id);
  if (rest.length) themes.push({ id: "other", title: themes.length ? "Other findings" : "", findings: rest });
  for (const th of themes) {
    const el = h("div", { class: "theme", id: "theme-" + slug(th.id || th.title) }, th.title ? h("h3", { html: inline(th.title) }) : null, th.thesis ? h("p", { html: inline(th.thesis) }) : null);
    for (const id of th.findings || []) if (byId[id]) el.append(finding(byId[id]));
    fs.append(el);
  }
  const haystack = {};
  function searchText(f) {
    return haystack[f.id] || (haystack[f.id] = [f.id, f.title, f.claim, f.change, f.area, f.lens, f.firstStep, ...(f.files || []),
      ...(f.evidence || []).flatMap((e) => [e.text, e.file, e.command])].filter(Boolean).join(" ").toLowerCase());
  }
  function applyFilters() {
    let shown = 0;
    for (const d of document.querySelectorAll("details.finding")) {
      const f = byId[d.id];
      const text = state.q ? searchText(f) : "";
      const ok = (!state.lens || f.lens === state.lens) && (!state.area || f.area === state.area) && (!state.strength || f.strength === state.strength)
        && (!state.action || f.action === state.action) && (!state.q || text.includes(state.q));
      d.classList.toggle("hidden", !ok);
      if (ok) shown++;
    }
    for (const t of document.querySelectorAll(".theme")) t.classList.toggle("hidden", !t.querySelector("details.finding:not(.hidden)"));
    for (const b of filterBar.querySelectorAll("button.f[data-key]")) b.setAttribute("aria-pressed", String(state[b.dataset.key] === b.dataset.value));
    areaChip.classList.toggle("hidden", !state.area);
    areaChip.textContent = state.area ? state.area + " ✕" : "";
    countEl.textContent = shown === findings.length ? `${shown} findings` : `${shown} of ${findings.length}`;
  }
  applyFilters();

  /* roadmap */
  if (R.roadmap && R.roadmap.length) {
    const s = section("roadmap", "Order of work", "What to do first and what waits for it.");
    s.append(h("div", { class: "waves" }, R.roadmap.map((w) => h("div", { class: "wave" }, h("h3", { html: inline(w.title) }), w.note ? h("p", { html: inline(w.note) }) : null,
      h("ol", {}, (w.items || []).map((it) => {
        const f = byId[it.finding];
        return h("li", {}, h("a", { href: "#" + it.finding, html: `<span class="mono">${esc(it.finding)}</span> ` + inline(f ? f.title : "") }), it.note ? h("small", { html: inline(it.note) }) : null);
      }))))));
  }

  /* Hotspots as commits against size: the top right is where a change costs most. A file of a finding links to it. */
  function scatter(hot) {
    const W = 680, H = 300, L = 48, B = 30, T = 14, RIGHT = 16;
    const maxC = Math.max(...hot.map((x) => x.commits)) || 1, maxL = Math.max(...hot.map((x) => x.loc)) || 1, maxF = Math.max(...hot.map((x) => x.fixes || 0)) || 1;
    const X = (c) => L + ((W - L - RIGHT) * c) / maxC, Y = (l) => H - B - (H - B - T) * Math.sqrt(l / maxL);
    const owner = (p) => findings.find((f) => (f.files || []).includes(p) || (f.evidence || []).some((e) => e.file === p));
    const named = new Set(hot.slice().sort((a, b) => b.commits * b.loc - a.commits * a.loc).slice(0, 6).map((x) => x.path));
    let s = `<svg class="scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hotspots: commits against lines">`
      + `<line class="axis" x1="${L}" y1="${H - B}" x2="${W - RIGHT}" y2="${H - B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/>`
      + `<text x="${W - RIGHT}" y="${H - 8}" text-anchor="end">commits →  (${maxC} at most)</text><text x="${L - 6}" y="${T + 4}" text-anchor="end">lines</text>`
      + `<text x="${L - 6}" y="${Y(maxL) + 16}" text-anchor="end">${Number(maxL).toLocaleString("en")}</text>`;
    for (const x of hot) {
      const f = owner(x.path), r = 4 + (7 * (x.fixes || 0)) / maxF, cx = X(x.commits), cy = Y(x.loc), base = x.path.split("/").pop();
      const dot = `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"><title>${esc(x.path)}: ${x.commits} commits, ${x.loc} lines${x.fixes ? ", " + x.fixes + " fixes" : ""}${f ? " · " + esc(f.id) : ""}</title></circle>`;
      s += f ? `<a href="#${esc(f.id)}">${dot}</a>` : dot;
      if (named.has(x.path)) s += `<text class="name" x="${(cx > W - 150 ? cx - r - 4 : cx + r + 4).toFixed(1)}" y="${(cy + 3).toFixed(1)}" text-anchor="${cx > W - 150 ? "end" : "start"}">${esc(base)}${f ? " · " + esc(f.id) : ""}</text>`;
    }
    return s + "</svg><p class='muted' style='font-size:.8rem;margin:-.4rem 0 1rem'>Larger dot: fixed more often. Colored: a finding of this report changes it.</p>";
  }

  /* evidence and method */
  const ev = section("evidence", "Evidence and method", "What the review rests on, what it kept out, and the full analyses.");
  function more(title, node, open) { if (!node) return; ev.append(h("details", Object.assign({ class: "more" }, open ? { open: "" } : {}), h("summary", { text: title }), h("div", {}, node))); }
  function plain(headers, rows) {
    return h("table", { class: "plain" }, h("thead", {}, h("tr", {}, headers.map((x) => h("th", { text: x })))),
      h("tbody", {}, rows.map((r) => h("tr", {}, r.map((c) => (c && c.nodeType ? c : h("td", typeof c === "number" ? { class: "n", text: c.toLocaleString("en") } : { html: c })))))));
  }
  if (R.healthy && R.healthy.length) more("In good shape: keep as it is", plain(["What", "Why it works"], R.healthy.map((x) => [inline(x.title), inline(x.note || "")])));
  if (R.dropped && R.dropped.length) more("Considered and dropped", plain(["Idea", "Why not", "Raised by"], R.dropped.map((x) => [inline(x.title), inline(x.reason || ""), esc(x.raisedBy || "")])));
  const sig = R.signals || {};
  if (sig.hotspots && sig.hotspots.length) {
    const max = Math.max(...sig.hotspots.map((x) => x.commits)) || 1;
    const bars = h("div", { class: "bars" });
    for (const x of sig.hotspots.slice(0, 15)) bars.append(h("div", { html: fileLink(x.path) }),
      h("div", { class: "track" }, h("div", { class: "fill " + (x.tone || ""), style: `width:${(100 * x.commits) / max}%` })),
      h("div", { class: "num", text: `${x.commits} commits · ${Number(x.loc).toLocaleString("en")} lines` + (x.fixes ? ` · ${x.fixes} fixes` : "") }));
    more("Hotspots: files changed often and large", h("div", {}, sig.note ? h("p", { class: "muted", html: inline(sig.note) }) : null,
      sig.hotspots.length > 3 ? h("div", { html: scatter(sig.hotspots) }) : null, bars));
  }
  if (sig.coupling && sig.coupling.length) more("Files that change together across areas", plain(["File", "File", "Shared commits", "Share"],
    sig.coupling.slice(0, 15).map((c) => [fileLink(c.a), fileLink(c.b), c.shared, Math.round(c.degree * 100) + "%"])));
  const panel = R.analysts || [];
  if (panel.length > 1 && findings.some((f) => f.votes)) {
    const vt = h("table", { class: "grid who" }, h("thead", {}, h("tr", {}, h("th", {}), panel.map((a) => h("th", { text: a.name || a.id })))));
    vt.append(h("tbody", {}, findings.map((f) => h("tr", {},
      h("th", {}, h("a", { href: "#" + f.id, title: f.title, html: `<span class="mono">${esc(f.id)}</span> ` + inline(f.title) })),
      panel.map((a) => { const v = (f.votes || {})[a.id] || "unreviewed"; return h("td", { class: "vote-cell " + v, text: VOTE[v][2] }); })))));
    more("Who found what", h("div", {}, h("p", { class: "muted", text: "Each analyst worked alone, then tried to refute the findings of the others without knowing who made them." }), vt));
  }
  if (R.analysts && R.analysts.length) more("Analysts and their full analyses", h("div", {},
    plain(["Analyst", "Model", "Role", "Analysis", "Review of the others"], R.analysts.map((a) => [esc(a.name || a.id), `<span class="mono">${esc(a.model || "")}</span>`, esc(a.role || ""),
      a.analysis ? `<a href="${esc(a.analysis)}">${esc(a.analysis)}</a>` : "", a.review ? `<a href="${esc(a.review)}">${esc(a.review)}</a>` : ""])),
    h("p", { class: "muted", style: "margin-top:.7rem", text: "On each finding: ● found it · ✓ confirmed it · ~ refined it · ✕ disputed it · · did not review it." })));
  if (R.method) more("Method and limits", h("div", { html: block(R.method.text) + (R.method.notExamined && R.method.notExamined.length ? "<h4 class='eyebrow' style='margin:.9rem 0 .3rem'>Not examined</h4>" + block(R.method.notExamined) : "") }));
  for (const x of R.sections || []) more(x.title, h("div", { html: block(x.text) }));
  if (!ev.querySelector("details.more")) ev.parentElement.remove();
  app.append(h("footer", {}, h("div", { class: "wrap", text: [R.title, R.date, R.path].filter(Boolean).join(" · ") })));

  /* ---------- theme, open all, deep links ---------- */
  function setTheme(t) {
    root.dataset.theme = t;
    for (const b of document.querySelectorAll("[data-theme-set]")) b.setAttribute("aria-pressed", String(b.dataset.themeSet === t));
    try { localStorage.setItem("health-report-theme", t); } catch (e) { /* storage is not available for a file opened from disk in some browsers */ }
  }
  for (const b of document.querySelectorAll("[data-theme-set]")) b.addEventListener("click", () => setTheme(b.dataset.themeSet));
  let saved = "auto";
  try { saved = localStorage.getItem("health-report-theme") || "auto"; } catch (e) { /* same */ }
  setTheme(saved);

  const toggleAll = document.getElementById("toggle-all");
  toggleAll.addEventListener("click", () => {
    const open = toggleAll.textContent === "Open all";
    for (const d of document.querySelectorAll("details.finding:not(.hidden), details.more")) d.open = open;
    toggleAll.textContent = open ? "Close all" : "Open all";
  });
  function openHash() {
    const el = location.hash.length > 1 && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!el || el.tagName !== "DETAILS") return;
    if (el.classList.contains("hidden")) { Object.assign(state, { lens: null, area: null, strength: null, action: null, q: "" }); search.value = ""; applyFilters(); }
    el.open = true; el.scrollIntoView();
  }
  addEventListener("hashchange", openHash);
  openHash();
  addEventListener("beforeprint", () => { for (const d of document.querySelectorAll("details")) { if (d.fill) d.fill(); d.open = true; } });

})();
</script>
</body>
</html>
