name: ci

# A push to a branch and a pull request run the daily checks, in parallel jobs: the .NET tests on Linux, Windows and
# macOS, the frontend tests, and the NuGet packages of each tool, built as dotnet-releaser builds them but not
# published. A tag runs dotnet-releaser alone: it builds, tests, packs and publishes the release.
on:
  push:
    paths-ignore:
    - '.alta/**'
    - 'doc/**'
    - 'site/**'
    - 'img/**'
    - '*.md'
    - '*.txt'
  pull_request:

# A newer push to a pull request replaces its run still going; the runs of a branch or a tag all go to their end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Linux runs every test project in one job. macOS runs them slower: its projects are split in groups, each job building
  # and testing its own, and the last group takes every test project of the solution that the others do not. Windows, the
  # slowest, and where the tests run before each change is submitted, builds everything and runs the test classes that
  # do something else on Windows (those that test `OperatingSystem.IsWindows()`).
  test:
    name: "Tests (${{ matrix.os }}${{ matrix.group && format(', {0}', matrix.group) || '' }})"
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - { os: windows-latest, group: Windows-specific, windows: true }
          - { os: macos-latest, group: desktop, projects: CodeAlta.Desktop.Tests }
          - { os: macos-latest, group: core, projects: CodeAlta.Tests CodeAlta.Plugin.Statistics.Tests }
          - { os: macos-latest, group: others, others: CodeAlta.Desktop.Tests CodeAlta.Tests CodeAlta.Plugin.Statistics.Tests }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Ubuntu 24.04 denies unprivileged user namespaces, which the sandbox of Chromium browsers needs: Edge then falls
      # back to a setuid helper the image leaves unconfigured, and aborts. The tests of the browser tools keep the sandbox.
      - name: "Allow the sandbox of Chromium browsers"
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Defender scans every file the build and the tests write, which slows both.
      - name: "Stop the real-time scan of Windows"
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: "Choose the tests"
        shell: bash
        env:
          PROJECTS: ${{ matrix.projects }}
          OTHERS: ${{ matrix.others }}
          WINDOWS: ${{ matrix.windows }}
        run: |
          set -euo pipefail
          if [ "$WINDOWS" = "true" ]; then
            # The classes of the test files that test OperatingSystem.IsWindows(), each matched by its name.
            classes=$(grep -rlE 'OperatingSystem\.IsWindows\(\)' --include='*.cs' src/CodeAlta*.Tests \
              | xargs grep -ohE '^\s*(public |internal )?(sealed |static |abstract )*(partial )?class [A-Za-z0-9_]+' | grep -oE '[A-Za-z0-9_]+$' | sort -u)
            echo "$(wc -l <<< "$classes") classes"
            echo "TEST_FILTER=$(sed 's/.*/FullyQualifiedName~.&./' <<< "$classes" | paste -sd'|')" >> "$GITHUB_ENV"
          fi
          if [ -z "$PROJECTS$OTHERS" ]; then echo "TESTS=src/CodeAlta.slnx" >> "$GITHUB_ENV"; exit 0; fi
          chosen=()
          for path in $(grep -oE 'Path="[^"]+Tests\.csproj"' src/CodeAlta.slnx | sed -E 's/Path="([^"]+)"/\1/'); do
            name=$(basename "$path" .csproj)
            if [ -n "$PROJECTS" ]; then [[ " $PROJECTS " == *" $name "* ]] || continue
            else [[ " $OTHERS " == *" $name "* ]] && continue; fi
            chosen+=("src/$path")
          done
          [ ${#chosen[@]} -gt 0 ] || { echo "::error::No test project in this group"; exit 1; }
          printf '%s\n' "${chosen[@]}"
          dotnet new sln --format slnx --name ci-tests --output src
          dotnet sln src/ci-tests.slnx add --in-root "${chosen[@]}"
          echo "TESTS=src/ci-tests.slnx" >> "$GITHUB_ENV"
      - name: "Build"
        run: dotnet build ${{ env.TESTS }} -c Release
      - name: "Test"
        shell: bash
        # A test that hangs is named and its run stopped, instead of the job running out of time.
        run: dotnet test "$TESTS" -c Release --no-build --blame-hang-timeout 10m --blame-hang-dump-type none ${TEST_FILTER:+--filter "$TEST_FILTER"}

  # The frontend tests import the RPC client that the build of CodeAlta generates (obj/neoastra): one build makes it
  # for every shard of the tests.
  frontend-client:
    name: "Frontend RPC client"
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: "Build"
        run: dotnet build src/CodeAlta/CodeAlta.csproj -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-rpc-client
          path: src/CodeAlta/obj/neoastra
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: "Frontend tests (${{ matrix.shard }}/4)"
    if: github.ref_type != 'tag'
    needs: frontend-client
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: "Allow the sandbox of Chromium browsers"
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CodeAlta/frontend/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: frontend-rpc-client
          path: src/CodeAlta/obj/neoastra
      - name: "Install"
        working-directory: src/CodeAlta/frontend
        run: npm ci --no-audit --no-fund
      # The first start of Edge on a new machine builds its caches and outlasts the start that the browser tests allow
      # (browserTarget.ts): it is done once here, and the tests start a warm Edge.
      - name: "Start Edge once"
        run: timeout 120 microsoft-edge --headless=new --disable-gpu --no-first-run --guest --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null
      # `npm test` with a shard of the files: each runs in this job, two at a time as in `npm test`.
      - name: "Test"
        working-directory: src/CodeAlta/frontend
        run: npx tsx --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 --test-reporter=./scripts/failures-reporter.mjs "src/**/*.test.ts" "src/**/*.test.tsx"

  pack:
    name: "Pack (${{ matrix.project }})"
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        project: [CodeAlta, CodeAlta.Tui, CodeAlta.Cli, CodeAlta.Node, CodeAlta.Server]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer versions the packages from the tags, as for a release.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # What dotnet-releaser runs for each packable project of the release: its pack, with a package for each runtime.
      - name: "Pack"
        run: dotnet pack src/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -o artifacts/nuget
      - name: "Check the packages"
        shell: bash
        run: |
          project=src/${{ matrix.project }}/${{ matrix.project }}.csproj
          rids=$(dotnet msbuild "$project" -getProperty:RuntimeIdentifiers -p:Configuration=Release)
          expected=$(( $(tr ';' '\n' <<< "$rids" | grep -c .) + 1 ))
          ls -l artifacts/nuget
          actual=$(find artifacts/nuget -name '*.nupkg' | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::$actual packages for $expected expected: the tool package and one for each of $rids"
            exit 1
          fi
          # nuget.org refuses a package over 250 MB.
          large=$(find artifacts/nuget -name '*.nupkg' -size +250M)
          if [ -n "$large" ]; then
            echo "::error::Packages over the 250 MB that nuget.org accepts: $large"
            exit 1
          fi

  release:
    name: "Release"
    if: github.ref_type == 'tag'
    permissions:
      id-token: write
      actions: write
      contents: write
    runs-on: 'ubuntu-latest'
    steps:
      # Ubuntu 24.04 denies unprivileged user namespaces, which the sandbox of Chromium browsers needs: Edge then falls
      # back to a setuid helper the image leaves unconfigured, and aborts. The tests of the browser tools keep the sandbox.
      - name: "Allow the sandbox of Chromium browsers"
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: "Build, Test, Pack and Publish"
        uses: xoofx/.github/.github/actions/dotnet-releaser-action@main
        env:
          # The Google client of CodeAlta sign-in, built into CodeAlta Server (CodeAlta.Server.csproj): never in the source.
          CODEALTA_SIGNIN_GOOGLE_CLIENT_ID: ${{ secrets.CODEALTA_SIGNIN_GOOGLE_CLIENT_ID }}
          CODEALTA_SIGNIN_GOOGLE_CLIENT_SECRET: ${{ secrets.CODEALTA_SIGNIN_GOOGLE_CLIENT_SECRET }}
