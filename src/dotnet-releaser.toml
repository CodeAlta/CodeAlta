# configuration file for dotnet-releaser
# Disable default packs - It will only publish NuGet and the Changelog
profile = "custom"
[msbuild]
project = "CodeAlta.slnx"
[test]
# Replace the default run, rather than executing the suite twice.
run_tests = false
[[test.runs]]
name = "Tests (failure-only summary)"
# VSTest's last logger wins over the bare GitHubActions logger added by dotnet-releaser.
# Keep totals and failure details, without thousands of passed/skipped entries (GitHub's 1 MiB limit).
args = ["--logger", "GitHubActions;summary-include-passed=false;summary-include-skipped=false"]
[github]
user = "CodeAlta"
repo = "CodeAlta"
[changelog]
# publish = false # Disable for now until release (as the changelog takes a huge amount of time to generate)
owners = ["xoofx"] # To avoid to be mentioned in the changelog
[nuget]
user = "xoofx"
trusted_publishing = true
