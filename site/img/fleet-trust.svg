<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" role="img" aria-labelledby="title desc">
  <title id="title">Why your machines do not have to trust the server</title>
  <desc id="desc">Your own devices sign who may do what: the list of devices, access, policies and automations. CodeAlta Server stores these signed documents and forwards them; it cannot change them or sign for you. Each machine checks every signature before it acts. Conversations travel encrypted end to end between your device and the machine that runs them; when the server relays them, it passes bytes it cannot read.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#150c33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d1ff"/>
      <stop offset=".55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0" stop-color="#00d1ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity=".32"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <symbol id="laptop" viewBox="0 0 200 132">
      <rect x="20" y="2" width="160" height="104" rx="10" fill="#0f1530" stroke="url(#edge)" stroke-width="3"/>
      <circle cx="40" cy="28" r="5" fill="#2dd4bf"/>
      <rect x="52" y="23" width="108" height="10" rx="5" fill="#26305e"/>
      <circle cx="40" cy="54" r="5" fill="#00d1ff"/>
      <rect x="52" y="49" width="86" height="10" rx="5" fill="#26305e"/>
      <circle cx="40" cy="80" r="5" fill="#a855f7"/>
      <rect x="52" y="75" width="98" height="10" rx="5" fill="#26305e"/>
      <path d="M2 112 H198 L186 128 H14 Z" fill="#1c2347" stroke="#3b4380" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="node" viewBox="0 0 180 92">
      <rect x="3" y="3" width="174" height="74" rx="18" fill="#121937" stroke="url(#edge)" stroke-width="3"/>
      <circle cx="30" cy="40" r="9" fill="#2dd4bf" filter="url(#soft)"/>
      <circle cx="30" cy="40" r="6" fill="#2dd4bf"/>
      <rect x="54" y="30" width="96" height="7" rx="3.5" fill="#26305e"/>
      <rect x="54" y="45" width="70" height="7" rx="3.5" fill="#26305e"/>
      <rect x="40" y="80" width="100" height="8" rx="4" fill="#1c2347"/>
    </symbol>
    <symbol id="server" viewBox="0 0 150 176">
      <g fill="#121937" stroke="url(#edge)" stroke-width="3">
        <rect x="3" y="3" width="144" height="50" rx="12"/>
        <rect x="3" y="63" width="144" height="50" rx="12"/>
        <rect x="3" y="123" width="144" height="50" rx="12"/>
      </g>
      <g fill="#00d1ff">
        <circle cx="26" cy="28" r="6"/>
        <circle cx="26" cy="88" r="6"/>
        <circle cx="26" cy="148" r="6"/>
      </g>
      <g fill="#26305e">
        <rect x="46" y="24" width="80" height="8" rx="4"/>
        <rect x="46" y="84" width="64" height="8" rx="4"/>
        <rect x="46" y="144" width="72" height="8" rx="4"/>
      </g>
    </symbol>
    <!-- A signed document: a page with a seal, 64 x 80 -->
    <symbol id="doc" viewBox="0 0 64 80">
      <path d="M4 4 H44 L60 20 V76 H4 Z" fill="#161d40" stroke="#b4c0ff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M44 4 V20 H60" fill="none" stroke="#b4c0ff" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="13" y="28" width="30" height="5" rx="2.5" fill="#3b4380"/>
      <rect x="13" y="39" width="38" height="5" rx="2.5" fill="#3b4380"/>
      <circle cx="44" cy="60" r="11" fill="#a855f7"/>
      <path d="M39 60 L43 64 L50 56" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- A key in a badge, 44 x 44 -->
    <symbol id="key" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="20" fill="#1b0b4a" stroke="#a855f7" stroke-width="2"/>
      <circle cx="16" cy="22" r="6" fill="none" stroke="#e6e9f5" stroke-width="2.6"/>
      <path d="M22 22 H34 M30 22 V27 M34 22 V26" fill="none" stroke="#e6e9f5" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <!-- A check in a badge, 44 x 44 -->
    <symbol id="check" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="20" fill="#08261f" stroke="#2dd4bf" stroke-width="2"/>
      <path d="M13 22 L19 28 L31 16" fill="none" stroke="#2dd4bf" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#1b0b4a" stroke="#00d1ff" stroke-width="2"/>
      <path d="M14 18 V15 a6 6 0 0 1 12 0 V18" fill="none" stroke="#e6e9f5" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="12" y="18" width="16" height="12" rx="3" fill="#e6e9f5"/>
    </symbol>
  </defs>

  <rect width="1600" height="880" rx="28" fill="url(#bg)"/>
  <ellipse cx="800" cy="300" rx="720" ry="260" fill="url(#glow)"/>

  <g font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
    <!-- Who may do what -->
    <text x="60" y="84" font-size="40" font-weight="700" fill="#f2f4ff">Who may do what</text>
    <text x="60" y="124" font-size="28" fill="#8f99bd">is signed by your devices and checked by your machines</text>

    <!-- Your devices -->
    <g transform="translate(60 160)">
      <use href="#laptop" x="80" y="20" width="200" height="132"/>
      <use href="#key" x="246" y="0" width="52" height="52"/>
      <text x="180" y="206" font-size="32" font-weight="600" fill="#f2f4ff" text-anchor="middle">Your devices</text>
      <g font-size="26" fill="#c9cfe6" text-anchor="middle">
        <text x="180" y="248">Owners and signers sign</text>
        <text x="180" y="282">the devices, access,</text>
        <text x="180" y="316">policies and automations.</text>
      </g>
    </g>

    <!-- The server -->
    <g transform="translate(620 160)">
      <use href="#server" x="118" y="0" width="124" height="146"/>
      <text x="180" y="206" font-size="32" font-weight="600" fill="#f2f4ff" text-anchor="middle">CodeAlta Server</text>
      <g font-size="26" fill="#c9cfe6" text-anchor="middle">
        <text x="180" y="248">Keeps and forwards what</text>
        <text x="180" y="282">was signed. It cannot</text>
        <text x="180" y="316">change it or sign for you.</text>
      </g>
    </g>

    <!-- Your machines -->
    <g transform="translate(1180 160)">
      <use href="#node" x="80" y="20" width="180" height="92"/>
      <use href="#node" x="116" y="82" width="140" height="72"/>
      <use href="#check" x="236" y="0" width="52" height="52"/>
      <text x="180" y="206" font-size="32" font-weight="600" fill="#f2f4ff" text-anchor="middle">Your machines</text>
      <g font-size="26" fill="#c9cfe6" text-anchor="middle">
        <text x="180" y="248">Check every signature</text>
        <text x="180" y="282">before they act, and refuse</text>
        <text x="180" y="316">what no signer signed.</text>
      </g>
    </g>

    <!-- Signed documents travel left to right -->
    <path d="M370 236 H714" stroke="url(#link)" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
    <path d="M888 236 H1240" stroke="url(#link)" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
    <use href="#doc" x="516" y="170" width="48" height="60"/>
    <use href="#doc" x="1040" y="170" width="48" height="60"/>
    <text x="540" y="278" font-size="24" fill="#7fe7ff" text-anchor="middle">signed</text>
    <text x="1064" y="278" font-size="24" fill="#7fe7ff" text-anchor="middle">as signed</text>

    <!-- Conversations -->
    <line x1="60" y1="530" x2="1540" y2="530" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.5"/>
    <text x="60" y="596" font-size="40" font-weight="700" fill="#f2f4ff">Conversations</text>
    <text x="60" y="636" font-size="28" fill="#8f99bd">stay between your device and the machine that runs them</text>

    <use href="#laptop" x="150" y="672" width="150" height="99"/>
    <use href="#server" x="742" y="672" width="76" height="89"/>
    <use href="#node" x="1290" y="690" width="160" height="82"/>
    <path d="M318 722 H1270" stroke="url(#link)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" fill="none"/>
    <path d="M318 722 H720 M842 722 H1270" stroke="url(#link)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <use href="#lock" x="450" y="702" width="40" height="40"/>
    <use href="#lock" x="1070" y="702" width="40" height="40"/>
    <g font-size="24" fill="#c9cfe6" text-anchor="middle">
      <text x="470" y="782">encrypted end to end</text>
      <text x="780" y="800">relays bytes it cannot read</text>
      <text x="1090" y="782">encrypted end to end</text>
    </g>
    <g font-size="26" font-weight="600" fill="#b4c0ff" text-anchor="middle">
      <text x="225" y="818">Your device</text>
      <text x="1370" y="818">The machine</text>
    </g>
  </g>
</svg>
