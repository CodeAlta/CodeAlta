<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CodeAlta</title>
  <desc id="desc">A summit shaped as the letter A, lit on one face, with a prompt cursor as its crossbar, between two code brackets.</desc>
  <defs>
    <!-- Opaque tile: the mark carries its own background, so it reads the same on light and dark surfaces. -->
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19C2FF"/>
      <stop offset="0.42" stop-color="#4B4DED"/>
      <stop offset="1" stop-color="#A12BE8"/>
    </linearGradient>
    <!-- Light behind the summit. -->
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 140) scale(300)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Depth at the foot of the tile. -->
    <linearGradient id="shade" x1="0" y1="300" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B0B4A" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B0B4A" stop-opacity="0.28"/>
    </linearGradient>
    <!-- The two faces of the summit: lit and in shade. -->
    <linearGradient id="lit" x1="256" y1="88" x2="120" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="shaded" x1="256" y1="88" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5DCFF"/>
      <stop offset="1" stop-color="#B4C0FF"/>
    </linearGradient>
  </defs>

  <!-- Tile, edge to edge with rounded corners -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect width="512" height="512" rx="116" fill="url(#shade)"/>

  <!-- Code brackets -->
  <path d="M126 148L58 218L126 288" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M386 148L454 218L386 288" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Summit / letter A -->
  <path d="M256 88L94 420H172L256 247.9Z" fill="url(#lit)"/>
  <path d="M256 88L418 420H340L256 247.9Z" fill="url(#shaded)"/>

  <!-- Prompt cursor -->
  <rect x="219" y="334" width="74" height="38" rx="8" fill="#7CF3FF"/>
</svg>
